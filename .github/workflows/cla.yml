name: CLA

# Asks first-time contributors to sign CLA.md, and records the signature in
# .github/cla-signatures.json on this repository.
#
# Setup required before this does anything:
#   1. Create a personal access token with `repo` scope.
#   2. Add it as the repository secret `CLA_TOKEN`.
# Until that secret exists the job is a no-op rather than a failing check, so
# pull requests are never blocked by a half-configured workflow.
#
# Note the detour through `env` below: `secrets` is not one of the contexts
# available to an `if:`, so testing it there is an invalid expression and the
# run fails without starting a job at all.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Job-level `env` may read `secrets`, and `env` is available to `if`, which
    # is the way to make a step conditional on whether a secret is set.
    env:
      configured: ${{ secrets.CLA_TOKEN != '' }}
    steps:
      - name: Check CLA signature
        if: >-
          ${{ env.configured == 'true'
              && (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
                  || github.event_name == 'pull_request_target') }}
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: .github/cla-signatures.json
          path-to-document: https://github.com/alaleks/ztabb/blob/master/CLA.md
          branch: master
          allowlist: dependabot[bot],alaleks
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/alaleks/ztabb/blob/master/CLA.md)
            and post the line below as a comment on this pull request. You will
            only ever be asked once.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thanks!
