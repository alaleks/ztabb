# ztabb links SDL3, so a full build needs it present. Both platforms get it and
# run the whole suite; the cross job then compiles every module for targets
# there is no SDL3 to link against here, which is what catches platform-gated
# code that a host build never analyses.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install SDL3
        run: brew install sdl3

      - name: Formatting
        run: zig fmt --check build.zig src tools/mkiconset.zig

      - name: Unit tests
        run: zig build test

      # Safety checks are on in Debug and ReleaseSafe but compiled out of
      # ReleaseFast, which is what ships. A bug that only trips an assert needs
      # the first; one that only appears under optimisation needs the last.
      - name: Unit tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: Unit tests (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast

      # The bundle is how the app is actually installed, and it does more than
      # the plain build: it renders the icon, runs iconutil, rewrites the SDL
      # load path and re-signs. All of that can break on its own.
      - name: Build app bundle
        run: zig build bundle -Doptimize=ReleaseFast

      - name: Check the bundle is self-contained
        run: |
          bin=zig-out/ztabb.app/Contents/MacOS/ztabb
          test -f zig-out/ztabb.app/Contents/Resources/ztabb.icns
          test -f zig-out/ztabb.app/Contents/Info.plist
          # The bundled glyph data is a Modified Version of JetBrains Mono,
          # and the OFL requires every distributed copy to carry the licence.
          test -f zig-out/ztabb.app/Contents/Resources/JetBrainsMono-OFL.txt
          # A Homebrew path here means the installed app breaks when the
          # formula is upgraded or removed.
          if otool -L "$bin" | grep -q /opt/homebrew; then
            echo "bundle still links a Homebrew path:" >&2
            otool -L "$bin" >&2
            exit 1
          fi
          codesign -v zig-out/ztabb.app

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # From the package manager where it exists, from source where it does
      # not: SDL3 is recent enough that older images carry no package.
      - name: Install SDL3
        run: ./tools/install-sdl3-linux.sh

      # The pty layer takes errno, O_NONBLOCK and signal numbers from the
      # platform because the BSD and Linux values differ. Only a Linux build
      # proves that.
      - name: Unit tests
        run: zig build test

      - name: Unit tests (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast

      - name: Build
        run: zig build -Doptimize=ReleaseFast

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          # Provisional, and here to answer a question rather than to stay.
          #
          # This action restores `.zig-cache` between runs, and the test
          # binaries the runner executes come straight out of it -- the failing
          # command names a path under `.zig-cache/o/`. One earlier run on this
          # job was cancelled part-way. Whatever a half-finished run leaves in
          # that directory, every later run then inherits, and that is the only
          # thing on this platform that could make a suite of pure arithmetic
          # sit for a minute without answering: `png` encodes bytes, it opens
          # no file, starts no process and touches no pty.
          #
          # A cold cache tells us which it is. If the job goes green, the
          # binaries were the problem and caching can come back with a fresh
          # key. If it still wedges, the cache was innocent and the fault is
          # ztabb's, on ground we have not yet looked at.
          use-cache: false

      # SDL3 from vcpkg, which is already on the runner image.
      - name: Install SDL3
        shell: bash
        run: |
          vcpkg install sdl3:x64-windows
          echo "SDL3_ROOT=$VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> "$GITHUB_ENV"

      # The pty here is ConPTY, a different implementation behind the same
      # API, so only a Windows run exercises it.
      #
      # Serially, on this platform only. `zig build` runs test binaries
      # concurrently, and the runner declares a step failed when it has not
      # heard from it for a minute -- so one suite that wedges takes down
      # whatever happened to be in flight beside it. That reported a suite with
      # no tests at all as hanging once, and a pure string lexer the next time,
      # which is a misleading thing to read a diagnosis out of. One at a time
      # costs a little wall clock and names the suite that is actually stuck.
      # Bounded, and on the step rather than the job. A wedged suite does not
      # stop `zig build` from waiting on it, and with no limit anywhere the run
      # sits until GitHub's six-hour default -- which is how the diagnostic
      # below came to never run at all. A job-level timeout would not do: that
      # cancels, and a cancelled job skips the steps that run `if: failure()`.
      # A step that times out merely fails, which is what the next one waits for.
      - name: Unit tests
        timeout-minutes: 12
        run: zig build test -j1

      # Runs only when the step above failed.
      #
      # A test binary run through `zig build` talks to the build runner over a
      # pipe, so its per-test progress is protocol and never reaches the log:
      # the suite that wedges is killed having said nothing about where it was,
      # which is why three runs gave nothing but a minute of silence. Run
      # directly, the same binary prints each test's name before running it and
      # appends OK when it returns -- so the last line with no OK after it is
      # the test that did not come back.
      #
      # `zig build test-bin` puts the binaries at a path worth naming. The
      # previous attempt at this dug them out of .zig-cache, which fails exactly
      # when it matters: the step above is killed at twelve minutes, so the
      # suites it had not reached were never built, and `xargs ls -t` over an
      # empty `find` runs `ls` on the working directory instead of nothing --
      # every missing binary came back as whichever log file had been written
      # last.
      #
      # Every suite, not only the one the log named: which one wedges has moved
      # between runs, and whether a binary misbehaves on its own or only under
      # the build runner is the thing worth knowing. The three that link SDL3
      # are left out, since they need its DLL beside them to start at all.
      - name: Run each suite standalone
        if: failure()
        timeout-minutes: 15
        shell: bash
        run: |
          set -u
          zig build test-bin -j1 || echo "note: not every suite could be built"
          logs="$RUNNER_TEMP/standalone"
          mkdir -p "$logs"
          for name in theme font icons appicon png panes macos terminal highlight ssh pty tabs; do
            exe="zig-out/test/$name.exe"
            if [ ! -f "$exe" ]; then
              printf '%-10s not built\n' "$name"
              continue
            fi
            "$exe" > "$logs/$name.log" 2>&1 &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt 90 ]; do
              sleep 1
              waited=$((waited + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -9 "$pid" 2>/dev/null || true
              printf '%-10s WEDGED after %ss, last line: %s\n' \
                "$name" "$waited" "$(tail -1 "$logs/$name.log")"
            else
              printf '%-10s %ss: %s\n' "$name" "$waited" "$(tail -1 "$logs/$name.log")"
            fi
          done
          exit 1

  cross:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-gnu, x86_64-macos, aarch64-macos, x86_64-windows-gnu]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # A host build hides platform-gated code. There is no SDL3 to link
      # against for these targets, so this compiles the core modules only.
      # Written out rather than looped: relying on word splitting to expand a
      # variable of arguments breaks under any shell that does not do it.
      # The objects go to a real directory rather than /dev/null, which the
      # debug-info writer cannot seek and panics on.
      - name: Compile core for ${{ matrix.target }}
        run: |
          set -eu
          t=${{ matrix.target }}
          out=$(mktemp -d)
          for m in font theme ssh icons appicon png pty macos panes; do
            zig build-obj -target "$t" -lc -Mroot="src/$m.zig" -femit-bin="$out/$m.o"
          done
          zig build-obj -target "$t" -lc \
            --dep theme -Mroot=src/terminal.zig -Mtheme=src/theme.zig \
            -femit-bin="$out/terminal.o"
          zig build-obj -target "$t" -lc \
            --dep theme -Mroot=src/highlight.zig -Mtheme=src/theme.zig \
            -femit-bin="$out/highlight.o"
          zig build-obj -target "$t" -lc \
            --dep pty --dep term --dep ssh -Mroot=src/tabs.zig \
            -Mpty=src/pty.zig \
            --dep theme -Mterm=src/terminal.zig -Mtheme=src/theme.zig \
            -Mssh=src/ssh.zig \
            -femit-bin="$out/tabs.o"
